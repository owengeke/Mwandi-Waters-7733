<!doctype html>
<html lang="en-KE">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="/favicon.ico" />
		<meta property="og:image" content="/og-image.png" />
		<meta name="theme-color" content="#FAFCFF" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0B132B" media="(prefers-color-scheme: dark)" />
		<title>Mwandi Waters</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply saved theme before first paint to avoid a flash.
			(function () {
				try {
					var t = localStorage.getItem("mw-theme") || "system";
					var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
					document.documentElement.style.colorScheme = dark ? "dark" : "light";
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
